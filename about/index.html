<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../assets/icons/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="About the Lunai project" />
    <title>About — Lunai</title>
  </head>
  <body data-page="about">
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">Skip to content</a>
    <div class="shell">
      <header class="site-header">
        <a class="logo" href="../">Lunai</a>
        <div class="site-header__end">
          <nav class="site-nav" data-i18n-aria-label="common.navMain" aria-label="Main navigation">
            <a href="../" data-i18n="common.home">Home</a>
            <a href="./" aria-current="page" data-i18n="common.about">About</a>
            <a href="../contact/" data-i18n="common.contact">Contact</a>
          </nav>
          <div class="lang-switch" role="group" data-i18n-aria-label="common.language" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="pl">PL</button>
          </div>
        </div>
      </header>

      <main id="main" class="main">
        <article class="page-article">
          <h1 data-i18n="about.title">About</h1>
          <p data-i18n="about.p1">
            This site is a template: multi-page Vite, ready to deploy on any static host (e.g. GitHub Pages).
          </p>
          <p data-i18n="about.p2">
            You can replace this text with a product or company description — the HTML structure and styles are intentionally simple.
          </p>
          <p><a class="inline-link" href="../contact/" data-i18n="about.linkContact">Go to contact →</a></p>
        </article>
      </main>

      <footer class="site-footer">
        <span data-i18n="common.footerBrand">© Lunai</span>
      </footer>
    </div>
    <script type="module" src="../src/subpages.js"></script>
  </body>
</html>
