# Deploy static site to Cloudflare Pages on every push to main.
#
# GitHub → Settings → Secrets and variables → Actions:
#   Secrets:
#     - CLOUDFLARE_API_TOKEN (Pages — Edit)
#     - CLOUDFLARE_ACCOUNT_ID (Account overview → Account ID)
#   Variables (not secrets):
#     - CF_PAGES_PROJECT_NAME — must match the Pages project name exactly (Workers & Pages
#       in Cloudflare dashboard: the project title / name in the list).
#
# The token and Account ID must belong to the same Cloudflare account as that project.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CF_PAGES_PROJECT_NAME
        run: |
          if [ -z "${{ vars.CF_PAGES_PROJECT_NAME }}" ]; then
            echo "::error::Set repository variable CF_PAGES_PROJECT_NAME (Settings → Secrets and variables → Actions → Variables) to your Cloudflare Pages project name."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CF_PAGES_PROJECT_NAME }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
